{% extends 'base.html' %}

{% block title %}Register - ShopSmart{% endblock %}

{% block content %}

<style>
    .auth-container {
        max-width: 420px;
        margin: 2rem auto;
        background: white;
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .auth-container h2 {
        text-align: center;
        font-size: 2rem;
        color: #1a1a2e;
        margin-bottom: 1.5rem;
    }

    .auth-container h2 span { color: #f0a500; }

    .auth-container label {
        font-weight: 600;
        display: block;
        margin: 0.8rem 0 0.3rem;
    }

    .auth-container input[type="text"],
    .auth-container input[type="password"],
    .auth-container input[type="email"] {
        width: 100%;
        padding: 0.8rem;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
    }

    .auth-container input:focus {
        border-color: #f0a500;
        outline: none;
    }

    .auth-container .btn-auth {
        width: 100%;
        padding: 0.9rem;
        background: #f0a500;
        color: #1a1a2e;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: background 0.3s ease;
    }

    .auth-container .btn-auth:hover { background: #ffb800; }

    .auth-container .auth-link {
        text-align: center;
        margin-top: 1rem;
        color: #6c757d;
    }

    .auth-container .auth-link a {
        color: #f0a500;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-container .auth-link a:hover { text-decoration: underline; }
</style>

<div class="auth-container">
    <h2>📝 <span>Register</span></h2>

    <form method="POST">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Choose a username" required>

        <label for="full_name">Full Name</label>
        <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Choose a password" required>

        <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <div class="auth-link">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
</div>

{% endblock %}
